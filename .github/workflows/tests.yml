name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (only what the compiler tests need)
        run: python -m pip install pytest pyyaml requests
      - name: Regression tests (no UiPath, no LLM)
        run: python -m pytest -q tests
      # The real UiPath build (scripts/uipath_build_check.py) needs UiPath Studio and stays a local check.
